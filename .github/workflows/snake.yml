name: Generate Retro Arcade Games

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) to keep contributions fresh without excessive runner load
    - cron: "0 */6 * * *"
  # Allows manual triggering from GitHub Actions tab
  workflow_dispatch:
  # Run on every push to main
  push:
    branches:
      - main

# Prevent parallel runs from colliding when deploying to the output branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Deploy Retro Arcade Games
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Ensure dist directory exists with full write permissions before running generators
      - name: Prepare dist directory
        run: |
          mkdir -p dist
          sudo chmod -R 777 dist

      # Generates retro Breakout brick-breaker game SVGs (runs as host runner user)
      - name: Generate Retro Breakout Game
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          games: 'breakout'
          hide_month_labels: 'false'

      # Generates retro snake SVGs and animated GIF (runs in Docker container)
      # Uses GH_TOKEN for private contributions, with safe fallback to GITHUB_TOKEN
      - name: Generate Retro Snake Game
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2338bdf8
            dist/github-contribution-grid-snake.gif?palette=github-dark&color_snake=%2338bdf8&color_background=%230d1117
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      # Reclaim dist folder ownership for the runner user before deploying
      - name: Reclaim dist ownership
        run: |
          sudo chown -R $USER:$USER dist
          sudo chmod -R 777 dist

      # Deploys the generated assets to the output branch
      - name: Push Arcade Assets to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update retro arcade contribution animations [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

